name: Initialize Flutter

on:
  workflow_dispatch:

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --platforms=android \
            --project-name=linki \
            --org=com.linki \
            .

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore: initialize flutter android project" || exit 0
          git push
